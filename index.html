<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Control de Ganancias</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box}body{margin:0;background:#f3f4f6}
header{background:#111827;color:#fff;padding:20px 18px 18px;position:sticky;top:0;z-index:2}
header h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#d1d5db}
main{max-width:760px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h2{font-size:19px;margin:0 0 14px}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 6px}
input,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.full{grid-column:1/-1}
button{border:0;border-radius:10px;padding:13px 15px;font-size:15px;font-weight:700;cursor:pointer}
.primary{width:100%;background:#111827;color:white;margin-top:15px}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#fee2e2;color:#991b1b}
.hidden{display:none!important}
.preview{margin-top:12px;background:#f9fafb;padding:12px;border-radius:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f9fafb;padding:13px;border-radius:11px}.stat small{color:#6b7280}.stat b{display:block;font-size:19px;margin-top:3px}
.item{border-top:1px solid #e5e7eb;padding:15px 0}.item:first-child{border-top:0}
.item h3{margin:0 0 7px}.item p{margin:5px 0;font-size:14px}
.profit{font-weight:800}.actions{margin-top:10px;display:flex;gap:7px}
.notice{font-size:13px;color:#6b7280;margin-top:8px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><h1>💰 Control de Ganancias</h1><p>Compra, venta e inventario</p></header>
<main>
<section class="card">
<h2 id="formTitle">Agregar producto</h2>
<label>Producto</label><input id="name" placeholder="Ej. Camisa">
<div class="grid">
<div><label>Tipo de compra</label>
<select id="currency"><option value="CRC">Compra en colones (₡)</option><option value="USD">Compra en dólares ($)</option></select></div>
<div><label>Cantidad</label><input id="qty" type="number" min="1" step="1" value="1"></div>
<div><label id="buyLabel">Precio de compra (₡)</label><input id="buy" type="number" min="0" step="0.01" placeholder="0"></div>
<div id="rateBox" class="hidden"><label>Tipo de cambio que pagaste</label><input id="rate" type="number" min="0" step="0.01" placeholder="Ej. 505"></div>
<div class="full"><label>Precio de venta (₡)</label><input id="sell" type="number" min="0" step="0.01" placeholder="0"></div>
</div>
<div id="preview" class="preview hidden"></div>
<button id="save" class="primary">Agregar producto</button>
<button id="cancel" class="secondary hidden" style="width:100%;margin-top:8px">Cancelar edición</button>
<div class="notice">En productos comprados en USD, el tipo de cambio es el que realmente pagaste por esos dólares.</div>
</section>

<section class="card">
<h2>Resumen</h2>
<div class="stats">
<div class="stat"><small>Productos</small><b id="count">0</b></div>
<div class="stat"><small>Inversión</small><b id="invested">₡0</b></div>
<div class="stat"><small>Ventas</small><b id="sales">₡0</b></div>
<div class="stat"><small>Ganancia</small><b id="profit">₡0</b></div>
</div>
</section>

<section class="card">
<h2>Mis productos</h2>
<div id="list"><p class="notice">No hay productos registrados.</p></div>
</section>
</main>
<script>
const KEY="cg_products_v1";
let products=JSON.parse(localStorage.getItem(KEY)||"[]");
let editing=null;
const $=id=>document.getElementById(id);
const money=n=>"₡"+Number(n).toLocaleString("es-CR",{minimumFractionDigits:0,maximumFractionDigits:2});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function toggleCurrency(){
 const usd=$("currency").value==="USD";
 $("rateBox").classList.toggle("hidden",!usd);
 $("buyLabel").textContent=usd?"Precio de compra ($)":"Precio de compra (₡)";
 updatePreview();
}
function updatePreview(){
 const usd=$("currency").value==="USD", buy=Number($("buy").value)||0, rate=Number($("rate").value)||0, sell=Number($("sell").value)||0;
 if(usd){
   const cost=buy*rate, profit=sell-cost, margin=cost?(profit/cost*100):0;
   $("preview").classList.remove("hidden");
   $("preview").innerHTML=`Costo real por unidad: <b>${money(cost)}</b><br>Ganancia por unidad: <b>${money(profit)}</b> · Margen: <b>${margin.toFixed(1)}%</b>`;
 }else{
   const profit=sell-buy, margin=buy?(profit/buy*100):0;
   $("preview").classList.remove("hidden");
   $("preview").innerHTML=`Ganancia por unidad: <b>${money(profit)}</b> · Margen: <b>${margin.toFixed(1)}%</b>`;
 }
}
function clearForm(){
 ["name","buy","rate","sell"].forEach(id=>$(id).value="");
 $("qty").value=1;$("currency").value="CRC";editing=null;
 $("formTitle").textContent="Agregar producto";$("save").textContent="Agregar producto";$("cancel").classList.add("hidden");
 toggleCurrency();
}
function save(){
 const name=$("name").value.trim(), qty=Number($("qty").value), buy=Number($("buy").value), sell=Number($("sell").value);
 const usd=$("currency").value==="USD", rate=Number($("rate").value);
 if(!name)return alert("Escribe el nombre del producto.");
 if(!Number.isFinite(qty)||qty<1)return alert("La cantidad debe ser al menos 1.");
 if(!Number.isFinite(buy)||buy<=0)return alert("Ingresa el precio de compra.");
 if(!Number.isFinite(sell)||sell<0)return alert("Ingresa el precio de venta.");
 if(usd&&(!Number.isFinite(rate)||rate<=0))return alert("Ingresa el tipo de cambio que pagaste.");
 const p={id:editing||Date.now(),name,qty,buy,sell,usd,rate:usd?rate:null};
 if(editing) products=products.map(x=>x.id===editing?p:x); else products.push(p);
 localStorage.setItem(KEY,JSON.stringify(products)); clearForm(); render();
}
function edit(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 editing=id;$("name").value=p.name;$("qty").value=p.qty;$("buy").value=p.buy;$("sell").value=p.sell;
 $("currency").value=p.usd?"USD":"CRC";$("rate").value=p.rate||"";
 $("formTitle").textContent="Editar producto";$("save").textContent="Guardar cambios";$("cancel").classList.remove("hidden");
 toggleCurrency();window.scrollTo({top:0,behavior:"smooth"});
}
function del(id){if(confirm("¿Eliminar este producto?")){products=products.filter(p=>p.id!==id);localStorage.setItem(KEY,JSON.stringify(products));render();}}
function render(){
 let inv=0,sales=0,profit=0;
 if(!products.length){$("list").innerHTML='<p class="notice">No hay productos registrados.</p>';}
 else $("list").innerHTML=products.map(p=>{
   const cost=p.usd?p.buy*p.rate:p.buy, unit=p.sell-cost, total=unit*p.qty;
   inv+=cost*p.qty;sales+=p.sell*p.qty;profit+=total;
   const margin=cost?(unit/cost*100):0;
   return `<div class="item"><h3>${esc(p.name)}</h3>
   <p>📦 Cantidad: <b>${p.qty}</b></p>
   <p>🛒 Compra: <b>${p.usd?"$"+p.buy.toLocaleString("en-US")+" × ₡"+p.rate.toLocaleString("es-CR")+" = "+money(cost):money(p.buy)}</b></p>
   <p>🏷️ Venta: <b>${money(p.sell)}</b></p>
   <p class="profit">💰 Ganancia por unidad: ${money(unit)}</p>
   <p class="profit">📈 Ganancia total: ${money(total)} · Margen: ${margin.toFixed(1)}%</p>
   <div class="actions"><button class="secondary" onclick="edit(${p.id})">Editar</button><button class="danger" onclick="del(${p.id})">Eliminar</button></div></div>`;
 }).join("");
 $("count").textContent=products.length;$("invested").textContent=money(inv);$("sales").textContent=money(sales);$("profit").textContent=money(profit);
}
$("currency").addEventListener("change",toggleCurrency);
["buy","rate","sell"].forEach(id=>$(id).addEventListener("input",updatePreview));
$("save").addEventListener("click",save);$("cancel").addEventListener("click",clearForm);
toggleCurrency();render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body></html>
